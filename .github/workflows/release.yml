name: Release

# 推一个 v* 的 tag 就会：在 GitHub 的 Windows 机器上用 PyInstaller 打包 exe，
# 然后自动创建 Release，说明取 RELEASE_NOTES_<tag>.md，附件为 Tuoz1Companion.exe。
# 正在运行的插件检测到新 Release 会自动更新。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag（如 v1.3.1，必须已存在）"
        required: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # numpy 和 onnxruntime 是本机认字（海克斯三选一）用的，和识别模型一起打进 exe
      - name: 安装 PyInstaller 和认字要用的库
        run: python -m pip install --upgrade pip pyinstaller numpy onnxruntime

      - name: 检查版本号和 tag 一致
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VER=$(grep -oP '^VERSION = "\K[^"]+' tuoz1_companion.py)
          if [ "v$VER" != "$TAG" ]; then
            echo "tuoz1_companion.py 里 VERSION=$VER，和 tag $TAG 不一致，先改版本号再打 tag"
            exit 1
          fi
          if [ ! -f "RELEASE_NOTES_$TAG.md" ]; then
            echo "没有 RELEASE_NOTES_$TAG.md，用 CHANGELOG 顶部段落代替"
            awk 'NR>1 && /^## /{n++} n<2' CHANGELOG.md > "RELEASE_NOTES_$TAG.md"
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      # 插件靠 http.client 里的这个内部钩子换掉连接方式（先连 IPv4、不在连不通的地址上干等）。
      # 哪天 Python 把它改没了，这一步会失败，而不是悄悄退回老的连法
      - name: 检查连接方式的钩子还在
        run: python -c "import http.client, inspect; assert '_create_connection' in inspect.getsource(http.client.HTTPConnection.connect)"

      - name: 打包 exe
        run: python -m PyInstaller --onefile --console --clean --name Tuoz1Companion --icon tuoz1.ico --add-data "tuoz1.ico;." --add-data "assets/ocr/ch_PP-OCRv4_rec_infer.onnx;assets/ocr" --add-data "avatar_wall/web;web" --collect-binaries onnxruntime tuoz1_companion.py

      - name: 自检 exe 能启动
        run: dist\Tuoz1Companion.exe --help

      # 头像墙（彩蛋功能）的程序和界面文件没打进去的话这一步会失败
      - name: 自检头像墙的文件都带上了
        run: dist\Tuoz1Companion.exe --avatar-wall-selftest

      # 模型或运行库没打进去的话这一步会失败，不会发出一个认不了字的版本
      - name: 自检本机认字能用
        run: dist\Tuoz1Companion.exe --ocr-selftest

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          body_path: RELEASE_NOTES_${{ env.TAG }}.md
          files: dist/Tuoz1Companion.exe
          prerelease: ${{ contains(env.TAG, '-') }}
